<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts-kokoelma</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18303d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0b0d12;--panel:#141821;--panel2:#1c2130;--ink:#f3f1ee;--mute:#98a0b3;--acc:#ff8a4c;--acc2:#ffb347;--line:rgba(255,255,255,.09);--danger:#ff5d5d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;background:rgba(20,24,33,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,138,76,.35)}
.logo::after{content:"";width:11px;height:12px;background:#1a1208;clip-path:polygon(0 0,100% 50%,0 100%);margin-left:2px}
.addbox{flex:1 1 320px;order:2;display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--bg);border:1px solid var(--line);transition:border-color .2s}
.addbox:focus-within{border-color:var(--acc)}
.addbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 14px}
.addbox input:focus-visible{outline:none}
.addbox input::placeholder{color:var(--mute)}
#add{border:0;border-radius:999px;padding:8px 18px;font-weight:700;color:#1a1208;background:linear-gradient(135deg,var(--acc),var(--acc2));transition:transform .15s,filter .15s}
#add:hover{filter:brightness(1.08)}#add:active{transform:scale(.96)}
#seg{margin-left:auto;display:flex;padding:3px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
#seg button{border:0;background:transparent;color:var(--mute);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;transition:background .2s,color .2s}
#seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}
@media (max-width:640px){.addbox{flex-basis:100%;order:3}}
#msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;z-index:20;text-align:center}
#msg:empty{display:none}
#msg.err{border-color:var(--danger);color:#ffb3b3}
main{flex:1;min-height:0;position:relative}
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{height:100%;position:relative;isolation:isolate;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.card::before{content:"";position:absolute;inset:-60px;z-index:-1;background:var(--cover,none) center/cover;filter:blur(50px) saturate(1.4) brightness(.4)}
.card[data-p="TikTok"]{background:#0a2a2e}.card[data-p="Instagram"]{background:#3a1a33}.card[data-p="YouTube"]{background:#3a1717}
.frame{height:calc(100% - 58px);aspect-ratio:9/16;max-width:100%;background:#000 center/cover no-repeat;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px var(--line)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{width:min(100%,360px);height:48px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-radius:999px;background:rgba(20,24,33,.75);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:14px}
.chip{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,138,76,.16);color:var(--acc2)}
.bar a{flex:1;display:flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;white-space:nowrap;overflow:hidden}
.bar a:hover{color:var(--ink)}.bar a svg{width:16px;height:16px}
.icon{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;transition:background .2s,color .2s}
.icon:hover{background:rgba(255,93,93,.15);color:var(--danger)}
.nav{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
.nav button{width:46px;height:46px;border-radius:50%;background:rgba(20,24,33,.8);backdrop-filter:blur(8px);border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,transform .15s}
.nav button:hover{background:var(--panel2)}.nav button:active{transform:scale(.92)}
#count{font-size:12px;font-weight:700;color:var(--mute);padding:4px 0}
#grid{height:100%;width:100%;max-width:640px;margin:0 auto;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
.tile{aspect-ratio:9/16;padding:0;border-radius:12px;background:#000 center/cover no-repeat;position:relative;overflow:hidden;border:2px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-2px)}
.tile[data-p="TikTok"]{background-color:#0d3b3f}.tile[data-p="Instagram"]{background-color:#4a2340}.tile[data-p="YouTube"]{background-color:#4a1f1f}
.tile.now{border-color:var(--acc)}
.tile i{position:absolute;top:5px;left:5px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 6px;font-size:10px;font-weight:700;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.empty{height:100%;display:grid;place-content:center;gap:6px;text-align:center;color:var(--mute);padding:24px}
.empty b{color:var(--ink);font-size:20px}
dialog{border:1px solid var(--line);padding:0;border-radius:22px;background:var(--panel2);color:var(--ink);width:min(380px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog[open]{animation:pop .18s ease-out}
dialog::backdrop{background:rgba(5,7,10,.72);backdrop-filter:blur(6px)}
.dlg{padding:24px}
.dlg h2{margin:0 0 8px;font-size:20px}.dlg p{margin:0 0 22px;color:var(--mute)}
.dlg .row{display:flex;gap:10px;justify-content:flex-end}
.dlg button{border-radius:999px;padding:10px 20px;font-weight:700;border:1px solid var(--line);background:transparent}
.dlg button.danger{background:var(--danger);border-color:var(--danger);color:#1a0808}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#feed{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"></span>Shorts</div>
  <div class="addbox">
    <input id="url" type="url" placeholder="Liitä YouTube Shorts-, TikTok- tai Instagram-linkki" aria-label="Videon linkki">
    <button id="add">Lisää</button>
  </div>
  <div id="seg" role="group" aria-label="Näkymä"><button data-v="feed" aria-pressed="true">Videot</button><button data-v="grid" aria-pressed="false">Kansikuvat</button></div>
</header>
<div id="msg" role="status"></div>
<main>
  <div id="feed"></div>
  <div class="nav" id="nav"><button id="snd"></button><button id="up" aria-label="Edellinen"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><div id="count"></div><button id="down" aria-label="Seuraava"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
  <div id="grid" hidden></div>
</main>

<dialog id="dlg"><div class="dlg"><h2 id="dtitle">Poistetaanko video?</h2><p>Video poistuu listalta kaikilta laitteilta. Toimintoa ei voi perua.</p><div class="row"><button id="dno">Peruuta</button><button id="dyes" class="danger">Poista</button></div></div></dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Liitä tähän oman Firebase-projektisi asetukset (Project settings → Your apps → Web)
const firebaseConfig = {
  apiKey: "AIzaSyAW2RYCGlv9Z8LcN9j0QJj-u2oGiovk1fM",
  authDomain: "musiikki-99dda.firebaseapp.com",
  projectId: "musiikki-99dda",
  storageBucket: "musiikki-99dda.firebasestorage.app",
  messagingSenderId: "553302575384",
  appId: "1:553302575384:web:926c9bab6641cc27d6b66d"
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const $ = id => document.getElementById(id);
const feed = $("feed"), grid = $("grid");
let msgTimer;
const msg = (t, err) => { const m = $("msg"); m.textContent = t; m.className = err ? "err" : ""; clearTimeout(msgTimer); msgTimer = setTimeout(() => m.textContent = "", err ? 9000 : 3500); };
const ICON_LINK = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>';
const dlg = $("dlg");
function ask(platform) {
  $("dtitle").textContent = `Poistetaanko ${platform}-video listalta?`;
  return new Promise(res => { dlg.returnValue = ""; dlg.onclose = () => res(dlg.returnValue === "yes"); dlg.showModal(); });
}
$("dyes").onclick = () => dlg.close("yes");
$("dno").onclick = () => dlg.close("no");
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close("no"); });
function updateCount() { $("count").textContent = state.items.length ? `${state.cur + 1}/${state.items.length}` : ""; }
const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const state = { items: [], cur: 0, view: "feed", curId: null, chosen: false,
  muted: iOS || !(navigator.userActivation && navigator.userActivation.hasBeenActive) };

// Automaattinen toisto toimii luotettavasti vain mykistettynä, kunnes sivua on napautettu kerran
const SND_ON = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SND_OFF = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
function updateSnd() {
  const b = $("snd"); b.innerHTML = state.muted ? SND_OFF : SND_ON;
  b.setAttribute("aria-label", state.muted ? "Laita äänet päälle" : "Mykistä");
}
function applySound() {
  const c = feed.children[state.cur], f = c && c.querySelector("iframe");
  if (f) send(f, state.muted ? "mute" : "unMute");
}
$("snd").onclick = () => { state.chosen = true; state.muted = !state.muted; updateSnd(); applySound(); };
function firstTap() { if (!iOS && !state.chosen && state.muted) { state.muted = false; updateSnd(); applySound(); } }
addEventListener("pointerdown", firstTap, { once: true });
addEventListener("keydown", firstTap, { once: true });
updateSnd();

let db;
try { db = getFirestore(initializeApp(firebaseConfig)); }
catch (e) { msg("Firebase-asetukset puuttuvat tai ovat virheelliset.", true); }

// Tunnistaa alustan, tekee upotusosoitteen (toisto silmukalla) ja kansikuvan
function parse(raw) {
  let u;
  try { u = new URL(String(raw).trim()); } catch { return null; }
  const h = u.hostname.replace(/^www\.|^m\./, "");
  let m;
  if (h === "youtube.com" || h === "youtu.be") {
    const id = h === "youtu.be" ? u.pathname.slice(1)
      : (m = u.pathname.match(/^\/(?:shorts|embed)\/([\w-]{6,})/)) ? m[1] : u.searchParams.get("v");
    return id ? { platform: "YouTube", thumb: `https://img.youtube.com/vi/${id}/hqdefault.jpg`,
      embed: `https://www.youtube.com/embed/${id}?enablejsapi=1&loop=1&playlist=${id}&playsinline=1&rel=0` } : null;
  }
  if (h === "tiktok.com" && (m = u.pathname.match(/\/video\/(\d+)/)))
    return { platform: "TikTok", thumb: "",
      embed: `https://www.tiktok.com/player/v1/${m[1]}?loop=1&rel=0&controls=1&music_info=0&description=0` };
  if (h === "instagram.com" && (m = u.pathname.match(/\/(reel|reels|p)\/([\w-]+)/)))
    return { platform: "Instagram", thumb: "",
      embed: `https://www.instagram.com/${m[1] === "p" ? "p" : "reel"}/${m[2]}/embed` };
  return null;
}

async function tiktokThumb(url) {
  try {
    const r = await fetch("https://www.tiktok.com/oembed?url=" + encodeURIComponent(url));
    return (await r.json()).thumbnail_url || "";
  } catch { return ""; }
}

$("add").onclick = async () => {
  const raw = $("url").value, p = parse(raw);
  if (!p) return msg("Linkkiä ei tunnistettu. TikTokissa tarvitaan koko linkki (…/video/numero), ei vm.tiktok.com-lyhennettä.", true);
  if (!db) return;
  try {
    if (p.platform === "TikTok") p.thumb = await tiktokThumb(raw.trim());
    await addDoc(collection(db, "videos"), { url: raw.trim(), platform: p.platform, thumb: p.thumb, createdAt: serverTimestamp() });
    $("url").value = ""; msg("Lisätty.");
  } catch (e) { msg("Tallennus epäonnistui: " + e.message, true); }
};
$("url").addEventListener("keydown", e => e.key === "Enter" && $("add").click());

// Soitto/tauko iframeen (YouTube ja TikTok tukevat; Instagram ei)
function send(f, name) { // name: play | pause | mute | unMute
  const w = f.contentWindow; if (!w) return;
  if (f.dataset.p === "YouTube")
    w.postMessage(JSON.stringify({ event: "command", func: { play: "playVideo", pause: "pauseVideo", mute: "mute", unMute: "unMute" }[name], args: [] }), "*");
  else if (f.dataset.p === "TikTok") w.postMessage({ type: name, "x-tiktok-player": true }, "*");
}
function cmd(f, play) {
  if (!play) return send(f, "pause");
  send(f, state.muted ? "mute" : "unMute");
  send(f, "play");
}

// Pitää ladattuna edellisen, nykyisen ja seuraavan videon. Vain nykyinen soi.
function sync() {
  [...feed.children].forEach((c, i) => {
    if (!c.classList.contains("card")) return;
    const f = c.querySelector(".frame");
    const want = state.view === "feed" && i >= state.cur - 1 && i <= state.cur + 1;
    const active = state.view === "feed" && i === state.cur;
    let ifr = f.querySelector("iframe");
    if (want && !ifr) {
      ifr = document.createElement("iframe");
      ifr.dataset.p = f.dataset.p;
      ifr.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      ifr.allowFullscreen = true;
      ifr.onload = () => {
        if (f.dataset.p === "YouTube") ifr.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "*");
        [400, 1200, 2600].forEach(ms => setTimeout(() => { if (ifr.isConnected) cmd(ifr, i === state.cur && state.view === "feed"); }, ms));
      };
      ifr.src = f.dataset.src + (state.muted && f.dataset.p === "YouTube" ? "&mute=1" : "");
      f.append(ifr);
    } else if (!want && ifr) ifr.remove();
    else if (ifr) cmd(ifr, active);
  });
}

const io = new IntersectionObserver(entries => {
  for (const en of entries) if (en.isIntersecting) {
    state.cur = +en.target.dataset.i;
    state.curId = en.target.dataset.id;
    updateCount();
    sync();
  }
}, { root: feed, threshold: 0.6 });

function goTo(i, instant) {
  const c = feed.children[Math.max(0, Math.min(i, state.items.length - 1))];
  if (!c) return;
  if (instant) feed.style.scrollBehavior = "auto";
  c.scrollIntoView({ block: "start" });
  if (instant) requestAnimationFrame(() => feed.style.scrollBehavior = "");
}

function setView(v) {
  state.view = v;
  feed.hidden = v !== "feed"; $("nav").hidden = v !== "feed"; grid.hidden = v !== "grid";
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  [...grid.children].forEach((t, i) => t.classList.toggle("now", i === state.cur));
  if (v === "feed") goTo(state.cur, true);
  sync();
}
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => setView(b.dataset.v));
$("up").onclick = () => goTo(state.cur - 1);
$("down").onclick = () => goTo(state.cur + 1);

function render(snap) {
  io.disconnect(); feed.replaceChildren(); grid.replaceChildren();
  state.items = [];
  snap.forEach(d => {
    const v = d.data(), p = parse(v.url);
    if (p) state.items.push({ id: d.id, url: v.url, platform: p.platform, embed: p.embed, thumb: v.thumb || p.thumb });
  });
  if (!state.items.length) {
    feed.innerHTML = '<div class="empty"><b>Ei vielä videoita</b><span>Liitä linkki ylös ja paina Lisää.</span></div>';
    updateCount();
    return;
  }
  const keep = state.items.findIndex(x => x.id === state.curId);
  state.cur = keep >= 0 ? keep : 0;

  state.items.forEach((v, i) => {
    const bg = v.thumb ? `url("${v.thumb}")` : "none";
    const c = document.createElement("section"); c.className = "card"; c.dataset.i = i; c.dataset.id = v.id; c.dataset.p = v.platform; c.style.setProperty("--cover", bg);
    const f = document.createElement("div"); f.className = "frame"; f.dataset.src = v.embed; f.dataset.p = v.platform; f.style.backgroundImage = bg;
    const bar = document.createElement("div"); bar.className = "bar";
    const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = v.platform;
    const a = document.createElement("a"); a.href = v.url; a.target = "_blank"; a.rel = "noopener"; a.innerHTML = ICON_LINK + "<span>Avaa alkuperäinen</span>";
    const del = document.createElement("button"); del.className = "icon"; del.setAttribute("aria-label", "Poista video"); del.innerHTML = ICON_TRASH;
    del.onclick = async () => { if (await ask(v.platform)) deleteDoc(doc(db, "videos", v.id)).catch(e => msg("Poisto epäonnistui: " + e.message, true)); };
    bar.append(chip, a, del); c.append(f, bar); feed.append(c); io.observe(c);

    const t = document.createElement("button"); t.className = "tile"; t.dataset.p = v.platform; t.style.backgroundImage = bg;
    t.setAttribute("aria-label", `Video ${i + 1}, ${v.platform}`);
    const s = document.createElement("span"); s.textContent = v.platform; const n = document.createElement("i"); n.textContent = i + 1; t.append(n, s);
    t.onclick = () => { state.cur = i; state.curId = v.id; setView("feed"); };
    if (i === state.cur) t.classList.add("now");
    grid.append(t);
  });
  goTo(state.cur, true);
  updateCount();
  sync();
}

if (db) onSnapshot(query(collection(db, "videos"), orderBy("createdAt", "desc")), render,
  e => msg("Tietokantavirhe: " + e.message, true));

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || state.view !== "feed") return;
  if (e.key === "ArrowDown") { e.preventDefault(); goTo(state.cur + 1); }
  if (e.key === "ArrowUp") { e.preventDefault(); goTo(state.cur - 1); }
});
</script>
</body>
</html>
