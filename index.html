<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts-kokoelma</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18303d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#10202a;--panel:#18303d;--ink:#eef3f5;--mute:#8fa8b4;--acc:#ffd166;--err:#ff8a80;--line:#2c4a5a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{padding:10px 12px;background:var(--panel);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header input{flex:1;min-width:180px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--acc);color:#1a1a1a;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#msg{width:100%;font-size:14px;color:var(--mute);min-height:18px}
#msg.err{color:var(--err)}
main{flex:1;min-height:0;position:relative}
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior:contain}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
.frame{height:calc(100% - 44px);aspect-ratio:9/16;max-width:100%;background:#000 center/cover no-repeat;border-radius:14px;overflow:hidden;position:relative}
.frame[data-p="TikTok"]{background-color:#0d3b3f}
.frame[data-p="Instagram"]{background-color:#4a2340}
.frame[data-p="YouTube"]{background-color:#4a1f1f}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--mute)}
.bar a{color:var(--acc)}
.bar button{padding:4px 10px;background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:400}
.nav{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:2}
.nav button{width:44px;height:44px;padding:0;border-radius:50%;background:rgba(24,48,61,.9);color:var(--ink);border:1px solid var(--line)}
#grid{height:100%;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;align-content:start}
.tile{aspect-ratio:9/16;padding:0;border-radius:10px;background:#000 center/cover no-repeat;position:relative;overflow:hidden;border:2px solid transparent;color:var(--ink)}
.tile[data-p="TikTok"]{background-color:#0d3b3f}
.tile[data-p="Instagram"]{background-color:#4a2340}
.tile[data-p="YouTube"]{background-color:#4a1f1f}
.tile.now{border-color:var(--acc)}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;font-weight:600;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.empty{margin:auto;color:var(--mute);text-align:center;padding:40px 20px}
@media (prefers-reduced-motion:reduce){#feed{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <input id="url" type="url" placeholder="Liitä YouTube Shorts-, TikTok- tai Instagram Reels -linkki" aria-label="Videon linkki">
  <button id="add">Lisää</button>
  <button id="toggle" class="ghost">Kansikuvat</button>
  <div id="msg" role="status"></div>
</header>
<main>
  <div id="feed"></div>
  <div class="nav" id="nav"><button id="up" aria-label="Edellinen">▲</button><button id="down" aria-label="Seuraava">▼</button></div>
  <div id="grid" hidden></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Liitä tähän oman Firebase-projektisi asetukset (Project settings → Your apps → Web)
const firebaseConfig = {
  apiKey: "AIzaSyAW2RYCGlv9Z8LcN9j0QJj-u2oGiovk1fM",
  authDomain: "musiikki-99dda.firebaseapp.com",
  projectId: "musiikki-99dda",
  storageBucket: "musiikki-99dda.firebasestorage.app",
  messagingSenderId: "553302575384",
  appId: "1:553302575384:web:926c9bab6641cc27d6b66d"
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const $ = id => document.getElementById(id);
const feed = $("feed"), grid = $("grid");
const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
const state = { items: [], cur: 0, view: "feed", curId: null };

let db;
try { db = getFirestore(initializeApp(firebaseConfig)); }
catch (e) { msg("Firebase-asetukset puuttuvat tai ovat virheelliset.", true); }

// Tunnistaa alustan, tekee upotusosoitteen (toisto silmukalla) ja kansikuvan
function parse(raw) {
  let u;
  try { u = new URL(String(raw).trim()); } catch { return null; }
  const h = u.hostname.replace(/^www\.|^m\./, "");
  let m;
  if (h === "youtube.com" || h === "youtu.be") {
    const id = h === "youtu.be" ? u.pathname.slice(1)
      : (m = u.pathname.match(/^\/(?:shorts|embed)\/([\w-]{6,})/)) ? m[1] : u.searchParams.get("v");
    return id ? { platform: "YouTube", thumb: `https://img.youtube.com/vi/${id}/hqdefault.jpg`,
      embed: `https://www.youtube.com/embed/${id}?enablejsapi=1&loop=1&playlist=${id}&playsinline=1&rel=0` } : null;
  }
  if (h === "tiktok.com" && (m = u.pathname.match(/\/video\/(\d+)/)))
    return { platform: "TikTok", thumb: "",
      embed: `https://www.tiktok.com/player/v1/${m[1]}?loop=1&rel=0&controls=1&music_info=0&description=0` };
  if (h === "instagram.com" && (m = u.pathname.match(/\/(reel|reels|p)\/([\w-]+)/)))
    return { platform: "Instagram", thumb: "",
      embed: `https://www.instagram.com/${m[1] === "p" ? "p" : "reel"}/${m[2]}/embed` };
  return null;
}

async function tiktokThumb(url) {
  try {
    const r = await fetch("https://www.tiktok.com/oembed?url=" + encodeURIComponent(url));
    return (await r.json()).thumbnail_url || "";
  } catch { return ""; }
}

$("add").onclick = async () => {
  const raw = $("url").value, p = parse(raw);
  if (!p) return msg("Linkkiä ei tunnistettu. TikTokissa tarvitaan koko linkki (…/video/numero), ei vm.tiktok.com-lyhennettä.", true);
  if (!db) return;
  try {
    if (p.platform === "TikTok") p.thumb = await tiktokThumb(raw.trim());
    await addDoc(collection(db, "videos"), { url: raw.trim(), platform: p.platform, thumb: p.thumb, createdAt: serverTimestamp() });
    $("url").value = ""; msg("Lisätty.");
  } catch (e) { msg("Tallennus epäonnistui: " + e.message, true); }
};
$("url").addEventListener("keydown", e => e.key === "Enter" && $("add").click());

// Soitto/tauko iframeen (YouTube ja TikTok tukevat; Instagram ei)
function cmd(f, play) {
  const w = f.contentWindow; if (!w) return;
  const p = f.dataset.p;
  if (p === "YouTube") w.postMessage(JSON.stringify({ event: "command", func: play ? "playVideo" : "pauseVideo", args: [] }), "*");
  else if (p === "TikTok") w.postMessage({ type: play ? "play" : "pause", "x-tiktok-player": true }, "*");
}

// Pitää ladattuna edellisen, nykyisen ja seuraavan videon. Vain nykyinen soi.
function sync() {
  [...feed.children].forEach((c, i) => {
    if (!c.classList.contains("card")) return;
    const f = c.querySelector(".frame");
    const want = state.view === "feed" && i >= state.cur - 1 && i <= state.cur + 1;
    const active = state.view === "feed" && i === state.cur;
    let ifr = f.querySelector("iframe");
    if (want && !ifr) {
      ifr = document.createElement("iframe");
      ifr.dataset.p = f.dataset.p;
      ifr.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      ifr.allowFullscreen = true;
      ifr.onload = () => {
        if (f.dataset.p === "YouTube") ifr.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "*");
        setTimeout(() => cmd(ifr, i === state.cur && state.view === "feed"), 400);
      };
      ifr.src = f.dataset.src;
      f.append(ifr);
    } else if (!want && ifr) ifr.remove();
    else if (ifr) cmd(ifr, active);
  });
}

const io = new IntersectionObserver(entries => {
  for (const en of entries) if (en.isIntersecting) {
    state.cur = +en.target.dataset.i;
    state.curId = en.target.dataset.id;
    sync();
  }
}, { root: feed, threshold: 0.6 });

function goTo(i, instant) {
  const c = feed.children[Math.max(0, Math.min(i, state.items.length - 1))];
  if (!c) return;
  if (instant) feed.style.scrollBehavior = "auto";
  c.scrollIntoView({ block: "start" });
  if (instant) requestAnimationFrame(() => feed.style.scrollBehavior = "");
}

function setView(v) {
  state.view = v;
  feed.hidden = v !== "feed"; $("nav").hidden = v !== "feed"; grid.hidden = v !== "grid";
  $("toggle").textContent = v === "feed" ? "Kansikuvat" : "Takaisin videoihin";
  if (v === "feed") goTo(state.cur, true);
  sync();
}
$("toggle").onclick = () => setView(state.view === "feed" ? "grid" : "feed");
$("up").onclick = () => goTo(state.cur - 1);
$("down").onclick = () => goTo(state.cur + 1);

function render(snap) {
  io.disconnect(); feed.replaceChildren(); grid.replaceChildren();
  state.items = [];
  snap.forEach(d => {
    const v = d.data(), p = parse(v.url);
    if (p) state.items.push({ id: d.id, url: v.url, platform: p.platform, embed: p.embed, thumb: v.thumb || p.thumb });
  });
  if (!state.items.length) {
    feed.innerHTML = '<div class="empty">Ei vielä videoita. Liitä linkki ylös ja paina Lisää.</div>';
    return;
  }
  const keep = state.items.findIndex(x => x.id === state.curId);
  state.cur = keep >= 0 ? keep : 0;

  state.items.forEach((v, i) => {
    const bg = v.thumb ? `url("${v.thumb}")` : "none";
    const c = document.createElement("section"); c.className = "card"; c.dataset.i = i; c.dataset.id = v.id;
    const f = document.createElement("div"); f.className = "frame"; f.dataset.src = v.embed; f.dataset.p = v.platform; f.style.backgroundImage = bg;
    const bar = document.createElement("div"); bar.className = "bar";
    const a = document.createElement("a"); a.href = v.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = v.platform + " – avaa alkuperäinen";
    const del = document.createElement("button"); del.textContent = "Poista";
    del.onclick = () => confirm("Poistetaanko video listalta?") && deleteDoc(doc(db, "videos", v.id));
    bar.append(a, del); c.append(f, bar); feed.append(c); io.observe(c);

    const t = document.createElement("button"); t.className = "tile"; t.dataset.p = v.platform; t.style.backgroundImage = bg;
    t.setAttribute("aria-label", `Video ${i + 1}, ${v.platform}`);
    const s = document.createElement("span"); s.textContent = `${i + 1}. ${v.platform}`; t.append(s);
    t.onclick = () => { state.cur = i; state.curId = v.id; setView("feed"); };
    if (i === state.cur) t.classList.add("now");
    grid.append(t);
  });
  goTo(state.cur, true);
  sync();
}

if (db) onSnapshot(query(collection(db, "videos"), orderBy("createdAt", "desc")), render,
  e => msg("Tietokantavirhe: " + e.message, true));

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || state.view !== "feed") return;
  if (e.key === "ArrowDown") { e.preventDefault(); goTo(state.cur + 1); }
  if (e.key === "ArrowUp") { e.preventDefault(); goTo(state.cur - 1); }
});
</script>
</body>
</html>
